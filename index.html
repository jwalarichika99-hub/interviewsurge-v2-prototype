<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InterviewSurge v2 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#111111}a:hover{color:#3F3F46}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn-dark:hover{background:#2E2E32 !important}
.btn-line:hover{border-color:#A1A1AA !important;background:#FAFAFA !important}
.btn-link:hover{text-decoration:underline;text-underline-offset:3px}
.nav:hover{background:#F6F6F7 !important}
.row:hover{border-color:#E3C79E !important}
.icon-btn:hover{background:#F4F4F5 !important}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
button:disabled{cursor:not-allowed}
input::placeholder{color:#71717A}
@keyframes is-pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}70%{box-shadow:0 0 0 8px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
.pulse{animation:is-pulse 2s infinite}
@keyframes is-rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{animation:is-rise .18s ease-out}
button,input,select{font-family:inherit}
.trow:hover{background:#FAFAFA !important}
.card:hover{border-color:#D4D4D8 !important}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
button,input,textarea{font-family:inherit}
.recent:hover{background:#FAFAFA !important}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
.file-in:focus-visible + label{outline:2px solid #2563EB;outline-offset:2px}
textarea:focus{border-color:#111111 !important}
input::placeholder,textarea::placeholder{color:#71717A}
.menu-item:hover{background:#F4F4F5 !important}
.th-btn:hover{color:#111111 !important}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #2563EB;outline-offset:2px}
.day:focus-visible{outline:2px solid #2563EB;outline-offset:-2px}
.tab:hover{color:#111111 !important}
input:focus,select:focus{border-color:#111111 !important}
.phone-box:focus-within{border-color:#111111 !important;outline:2px solid #2563EB;outline-offset:2px}
.phone-box input:focus-visible{outline:none}
.btn-red:hover{background:#912018 !important}
@keyframes is-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.savebar{animation:is-up .18s ease-out}
html,body{height:100%}
body{overflow:hidden;font-family:'Outfit',ui-sans-serif,system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
.proto-bar{flex-shrink:0;height:48px;display:flex;align-items:center;gap:20px;padding:0 20px;background:#111111;color:#FFFFFF;font-size:14px}
.proto-note{color:#A1A1AA;font-size:12px;white-space:nowrap}
.proto-narrow{display:none;flex-shrink:0;padding:10px 16px;background:#FFF8EE;color:#111111;font-size:13px;border-bottom:1px solid #F3D9B1}
@media (max-width:1100px){.proto-note{display:none}}
@media (max-width:760px){.proto-name{display:none}.proto-narrow{display:block}.proto-bar{gap:12px;padding:0 12px}}
.proto-name{font-weight:600;white-space:nowrap}
.proto-tabs{display:flex;gap:4px;flex-grow:1;overflow-x:auto}
.proto-tab{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;color:#D4D4D8 !important;text-decoration:none;font-weight:500;white-space:nowrap}
.proto-tab:hover{background:#2E2E32;color:#FFFFFF !important}
.proto-tab.on{background:#FFFFFF;color:#111111 !important;font-weight:600}
.proto-state{display:inline-flex;align-items:center;gap:8px;color:#D4D4D8;white-space:nowrap}
.proto-state select{height:32px;padding:0 8px;border-radius:8px;border:1px solid #52525B;background:#1F1F22;color:#FFFFFF;font:inherit}
#stage{flex:1 1 auto;min-height:0;overflow:auto}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl-home">
<div style="width:1440px; height:1140px; position:relative; display:flex; flex-direction:column; background:#FFFFFF; color:#111111; font-family:'Outfit', ui-sans-serif, system-ui, sans-serif; overflow:hidden">

<header style="height:88px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 40px 0 44px; border-bottom:1px solid #ECECEE">
<div style="font-size:30px; line-height:36px; letter-spacing:-0.01em"><span style="font-weight:400">interview</span><span style="font-weight:600">Surge</span></div>
<div style="display:flex; align-items:center; gap:8px">
<button class="icon-btn" aria-label="Notifications: {{taskCount}} things need you" style="position:relative; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border:none; border-radius:22px; background:#FFFFFF; color:#111111; cursor:pointer">
<svg class="i" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
<sc-if value="{{hasTasks}}" hint-placeholder-val="{{true}}"><span style="position:absolute; top:3px; right:3px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; border:2px solid #FFFFFF; background:#111111; color:#FFFFFF; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center">{{taskCount}}</span></sc-if>
</button>
<button class="icon-btn" aria-label="Account" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; border:1px solid #E6E6E9; border-radius:22px; background:#FAFAFA; color:#111111; cursor:pointer">
<svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
</button>
</div>
</header>

<div style="flex-grow:1; min-height:0; display:flex">

<nav aria-label="Main" style="width:248px; flex-shrink:0; display:flex; flex-direction:column; gap:2px; padding:20px 16px; border-right:1px solid #ECECEE">
<button class="nav" onClick="{{goHome}}" aria-current="{{nav.home.cur}}" style="width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border:none; border-radius:10px; background:{{nav.home.bg}}; color:#111111; font-size:16px; font-weight:{{nav.home.w}}; text-align:left; cursor:pointer">
<svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:#3F3F46"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
<span style="flex-grow:1">Home</span>
</button>

<div style="padding:20px 12px 8px; font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#6B6B73">Job search</div>
<button class="nav" onClick="{{goMatches}}" aria-current="{{nav.matches.cur}}" style="width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border:none; border-radius:10px; background:{{nav.matches.bg}}; color:#111111; font-size:16px; font-weight:{{nav.matches.w}}; text-align:left; cursor:pointer">
<svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:#3F3F46"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><rect width="20" height="14" x="2" y="6" rx="2"></rect></svg>
<span style="flex-grow:1">Job matches</span>
<sc-if value="{{hasPending}}" hint-placeholder-val="{{true}}"><span style="min-width:24px; height:22px; padding:0 7px; border-radius:11px; background:#FFF1DE; color:#B45309; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center">{{pending}}</span></sc-if>
</button>
<a class="nav" href="Analytics.dc.html" style="width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border-radius:10px; background:transparent; color:#111111; font-size:16px; font-weight:500; text-decoration:none">
<svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:#3F3F46"><path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg>
<span style="flex-grow:1">Analytics</span>
</a>

<div style="padding:20px 12px 8px; font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#6B6B73">CVs</div>
<a class="nav" href="CVLibrary.dc.html" style="width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border-radius:10px; background:transparent; color:#111111; font-size:16px; font-weight:500; text-decoration:none">
<svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:#3F3F46"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
<span style="flex-grow:1">CV library</span>
</a>
<a class="nav" href="InstantCV.dc.html" style="width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border-radius:10px; background:transparent; color:#111111; font-size:16px; font-weight:500; text-decoration:none">
<svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:#3F3F46"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg>
<span style="flex-grow:1">Instant CV</span>
</a>

<div style="flex-grow:1"></div>

<div style="margin:0 4px 12px; padding:14px; border-radius:12px; background:#F7F7F8; display:flex; flex-direction:column; gap:8px">
<div style="display:flex; justify-content:space-between; align-items:baseline">
<span style="font-size:13px; color:#52525B">Job packages</span>
<span style="font-size:13px; font-weight:600">597 of 600 left</span>
</div>
<div style="height:6px; border-radius:3px; background:#E4E4E7; overflow:hidden"><div style="width:99.5%; height:100%; border-radius:3px; background:#111111"></div></div>
<div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#6B6B73">
<span>Valid until 27 Sep 2027</span>
<button class="btn-link" onClick="{{notInProto}}" style="padding:0; border:none; background:none; color:#111111; font-size:12px; font-weight:600; cursor:pointer">Manage</button>
</div>
</div>

<a class="nav" href="Settings.dc.html" style="width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border-radius:10px; background:transparent; color:#111111; font-size:16px; font-weight:500; text-decoration:none">
<svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:#3F3F46"><path d="M21 4h-7"></path><path d="M10 4H3"></path><path d="M21 12h-9"></path><path d="M8 12H3"></path><path d="M21 20h-5"></path><path d="M12 20H3"></path><path d="M14 2v4"></path><path d="M8 10v4"></path><path d="M16 18v4"></path></svg>
<span style="flex-grow:1">Settings</span>
</a>
<button class="nav" onClick="{{notInProto}}" style="width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border:none; border-radius:10px; background:transparent; color:#111111; font-size:16px; font-weight:500; text-align:left; cursor:pointer">
<svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:#3F3F46"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
<span style="flex-grow:1">Talk to our team</span>
</button>
<button class="nav" onClick="{{notInProto}}" style="width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 12px; border:none; border-radius:10px; background:transparent; color:#52525B; font-size:16px; font-weight:500; text-align:left; cursor:pointer">
<svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color:#6B6B73"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
<span style="flex-grow:1">Sign out</span>
</button>
</nav>

<main style="flex-grow:1; min-width:0; overflow-y:auto; padding:40px 48px 48px">

<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<div style="display:flex; flex-direction:column; gap:40px">

<div style="display:flex; flex-direction:column; gap:6px">
<h1 style="margin:0; font-size:32px; line-height:40px; font-weight:600; letter-spacing:-0.01em">Welcome back, InterviewSurge</h1>
<p style="margin:0; font-size:16px; line-height:24px; color:#52525B">Here’s what needs you, and what we’re doing for you.</p>
</div>

<div style="display:flex; gap:32px; align-items:flex-start">

<section aria-label="{{eyebrow}}" style="flex-grow:1; min-width:0; display:flex; flex-direction:column; gap:14px">
<div style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#3F3F46">
<span style="width:8px; height:8px; border-radius:4px; background:{{eyebrowDot}}"></span>
<span>{{eyebrow}}</span>
</div>

<sc-if value="{{heroReview}}" hint-placeholder-val="{{true}}">
<div style="display:flex; gap:24px; padding:28px; border-radius:18px; background:#FFF8EE; border:1px solid #F3D9B1">
<div style="flex-grow:1; min-width:0; display:flex; flex-direction:column; gap:14px">
<div style="display:flex; align-items:center; gap:10px">
<span style="width:26px; height:26px; border-radius:13px; background:#111111; color:#FFFFFF; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center">1</span>
<span style="padding:4px 10px; border-radius:999px; background:#FFFFFF; border:1px solid #F3D9B1; color:#B45309; font-size:13px; font-weight:600">Waiting for your approval</span>
</div>
<h2 style="margin:0; font-size:28px; line-height:34px; font-weight:600; letter-spacing:-0.01em">{{reviewTitle}}</h2>
<p style="margin:0; font-size:15px; line-height:23px; color:#52525B">We found these roles and tailored a CV for each one. Approve the ones you like and we’ll apply for you.</p>
<div style="flex-grow:1"></div>
<div style="display:flex; flex-direction:column; align-items:flex-start; gap:10px">
<button class="btn-dark" onClick="{{goReview}}" style="display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0 22px; border:none; border-radius:12px; background:#111111; color:#FFFFFF; font-size:15px; font-weight:600; cursor:pointer">{{reviewCta}}<svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
<span style="font-size:13px; color:#6B6B73">We only apply to jobs you approve.</span>
</div>
</div>
<div style="width:320px; flex-shrink:0; display:flex; flex-direction:column; gap:8px">
<sc-for list="{{pendingCards}}" as="job" hint-placeholder-count="4">
<button class="row" onClick="{{job.open}}" aria-label="Review {{job.role}} at {{job.company}}" style="width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; border:1px solid #F0E2CC; background:#FFFFFF; color:#111111; text-align:left; cursor:pointer">
<span style="width:36px; height:36px; flex-shrink:0; border-radius:10px; background:#F1F1F2; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center">{{job.initial}}</span>
<span style="flex-grow:1; min-width:0; display:flex; flex-direction:column; gap:1px">
<span style="font-size:15px; line-height:20px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{job.role}}</span>
<span style="font-size:13px; line-height:18px; color:#6B6B73; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{job.company}} · {{job.where}}</span>
</span>
<svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="color:#A1A1AA"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</sc-for>
<span style="display:flex; align-items:center; gap:6px; padding:2px 4px 0; font-size:12px; color:#6B6B73"><svg class="i" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>A tailored CV is ready for each</span>
</div>
</div>
</sc-if>

<sc-if value="{{heroProfile}}" hint-placeholder-val="{{false}}">
<div style="display:flex; gap:24px; padding:28px; border-radius:18px; background:#FFF8EE; border:1px solid #F3D9B1">
<div style="flex-grow:1; min-width:0; display:flex; flex-direction:column; gap:14px">
<div style="display:flex; align-items:center; gap:10px">
<span style="width:26px; height:26px; border-radius:13px; background:#111111; color:#FFFFFF; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center">1</span>
<span style="padding:4px 10px; border-radius:999px; background:#FFFFFF; border:1px solid #F3D9B1; color:#B45309; font-size:13px; font-weight:600">One step left</span>
</div>
<h2 style="margin:0; font-size:28px; line-height:34px; font-weight:600; letter-spacing:-0.01em">Finish your application profile</h2>
<p style="margin:0; font-size:15px; line-height:23px; color:#52525B">Answer the questions employers ask most, like your right to work, notice period and expected pay.</p>
<div style="flex-grow:1"></div>
<div style="display:flex; flex-direction:column; align-items:flex-start; gap:10px">
<button class="btn-dark" onClick="{{goProfile}}" style="display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0 22px; border:none; border-radius:12px; background:#111111; color:#FFFFFF; font-size:15px; font-weight:600; cursor:pointer">Complete profile<svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
<span style="font-size:13px; color:#6B6B73">You fill this in once. We reuse it for every application.</span>
</div>
</div>
<div style="width:320px; flex-shrink:0; display:flex; flex-direction:column; gap:4px; padding:16px 18px; border-radius:14px; background:#FFFFFF; border:1px solid #F0E2CC; align-self:flex-start">
<div style="display:flex; align-items:center; gap:8px; padding-bottom:10px; font-size:14px; font-weight:600"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>All job matches reviewed</div>
<div style="height:1px; background:#F1F1F2"></div>
<sc-for list="{{profileSections}}" as="p" hint-placeholder-count="3">
<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0">
<span style="font-size:14px">{{p.title}}</span>
<span style="padding:2px 8px; border-radius:999px; background:{{p.statusBg}}; color:{{p.statusColor}}; font-size:12px; font-weight:600">{{p.status}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{heroFirst}}" hint-placeholder-val="{{false}}">
<div style="display:flex; gap:24px; padding:28px; border-radius:18px; background:#FFFFFF; border:1px solid #E6E6E9">
<div style="flex-grow:1; min-width:0; display:flex; flex-direction:column; gap:14px">
<div style="display:flex; align-items:center; gap:10px">
<span class="pulse" style="width:10px; height:10px; border-radius:5px; background:#2563EB"></span>
<span style="padding:4px 10px; border-radius:999px; background:#EFF4FF; border:1px solid #D6E2FD; color:#1D4ED8; font-size:13px; font-weight:600">Scheduled</span>
</div>
<h2 style="margin:0; font-size:28px; line-height:34px; font-weight:600; letter-spacing:-0.01em">Your first job search runs today at 6:30 PM IST</h2>
<p style="margin:0; font-size:15px; line-height:23px; color:#52525B">We’re looking for roles that match your preferences. When they’re ready, we’ll tailor a CV for each one and ask for your go-ahead here.</p>
<div style="flex-grow:1"></div>
<div style="display:flex; align-items:center; gap:20px">
<button class="btn-line" onClick="{{notInProto}}" style="display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 18px; border:1px solid #D4D4D8; border-radius:12px; background:#FFFFFF; color:#111111; font-size:15px; font-weight:600; cursor:pointer">Review job preferences</button>
<button class="btn-link" onClick="{{notInProto}}" style="display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0; border:none; background:none; color:#111111; font-size:14px; font-weight:600; cursor:pointer">Talk to our team</button>
</div>
</div>
<div style="width:300px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; padding:18px; border-radius:14px; background:#FAFAFA">
<div style="font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#6B6B73">How it works</div>

      { id: 'j2', role: 'Full Stack Developer (React, Node)', company: 'Brightpath', initial: 'B', where: 'Remote · India', reasons: [{ text: 'Remote, as you prefer' }, { text: 'TypeScript on your CV' }] },
      { id: 'j3', role: 'Software Engineer, Full Stack', company: 'Lumen Health', initial: 'L', where: 'Mumbai · On-site', reasons: [{ text: 'Fits your experience level' }, { text: 'In a city you picked' }] },
      { id: 'j4', role: 'Full Stack Engineer II', company: 'Kestrel Mobility', initial: 'K', where: 'Pune · Hybrid', reasons: [{ text: 'PostgreSQL on your CV' }, { text: 'Hybrid, as you prefer' }] }
    ];
  }

  prior() {
    return [
      { id: 'p1', role: 'Full Stack Developer', company: 'Orbit Retail', initial: 'O', where: 'Bengaluru · Hybrid' },
      { id: 'p2', role: 'Senior Software Engineer, Web', company: 'Cedar Cloud', initial: 'C', where: 'Remote · India' }
    ];
  }

  sections() {
    return [
      { key: 'screening', title: 'About you and contact', desc: 'Name, date of birth, address and online profiles' },
      { key: 'references', title: 'Work authorisation', desc: 'Your right to work and any visa sponsorship' },
      { key: 'cover', title: 'Availability and pay', desc: 'Start date, notice period and expected salary' }
    ];
  }

  base(sc) {
    const none = { screening: false, references: false, cover: false };
    const all = { screening: true, references: true, cover: true };
    const common = { screen: 'home', tab: 'waiting', msg: '', sent: [], toast: null };
    if (sc === 'All caught up') return Object.assign(common, { isNew: false, hasJobs: true, decisions: { j1: 'approved', j2: 'approved', j3: 'skipped', j4: 'approved' }, profile: all, profileDone: true });
    if (sc === 'First search scheduled') return Object.assign(common, { isNew: false, hasJobs: false, decisions: {}, profile: none, profileDone: false });
    if (sc === 'New user') return Object.assign(common, { isNew: true, hasJobs: false, decisions: {}, profile: none, profileDone: false });
    return Object.assign(common, { isNew: false, hasJobs: true, decisions: {}, profile: none, profileDone: false });
  }

  scenario() {
    return this.props.scenario ?? 'Needs approval';
  }

  cur() {
    const sc = this.scenario();
    const st = this.state;
    if (st && st.forScenario === sc) return st;
    return Object.assign({ forScenario: sc }, this.base(sc));
  }

  put(patch) {
    const sc = this.scenario();
    this.setState((prev) => {
      const b = prev && prev.forScenario === sc ? prev : Object.assign({ forScenario: sc }, this.base(sc));
      const p = typeof patch === 'function' ? patch(b) : patch;
      return Object.assign({}, b, p, { forScenario: sc });
    });
  }

  armToast() {
    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.put({ toast: null }), 4200);
  }

  say(text) {
    this.armToast();
    this.put({ toast: { text: text, undo: null } });
  }

  decide(ids, val, text) {
    if (text) this.armToast();
    this.put((c) => {
      const d = Object.assign({}, c.decisions);
      ids.forEach((id) => { if (val) d[id] = val; else delete d[id]; });
      return { decisions: d, toast: text ? { text: text, undo: val ? ids : null } : null };
    });
  }

  componentWillUnmount() {
    clearTimeout(this._tt);
  }

  renderVals() {
    const c = this.cur();
    const dec = c.decisions || {};
    const hj = !!c.hasJobs;
    const all = hj ? this.jobs() : [];
    const pendingJobs = all.filter((j) => !dec[j.id]);
    const approvedNew = all.filter((j) => dec[j.id] === 'approved');
    const skipped = all.filter((j) => dec[j.id] === 'skipped');
    const prior = hj ? this.prior() : [];
    const pending = pendingJobs.length;
    const approvedCount = prior.length + approvedNew.length;
    const prof = c.profile || {};
    const secs = this.sections();
    const profCount = secs.filter((x) => prof[x.key]).length;

    const hero = c.isNew ? 'new' : !hj ? 'first' : pending > 0 ? 'review' : !c.profileDone ? 'profile' : 'clear';
    const heroIsTask = hero === 'new' || hero === 'review' || hero === 'profile';
    const showProfileRow = !c.profileDone && (hero === 'new' || hero === 'review' || hero === 'first');
    const taskCount = (heroIsTask ? 1 : 0) + (showProfileRow ? 1 : 0);

    const s = c.screen;
    const nav = {};
    ['home', 'matches', 'analytics', 'cvs', 'instant', 'settings'].forEach((k) => {
      const on = s === k;
      nav[k] = { bg: on ? '#F1F1F2' : 'transparent', w: on ? '600' : '500', cur: on ? 'page' : undefined };
    });
    const go = (screen, extra) => () => this.put(Object.assign({ screen: screen }, extra || {}));
    const notInProto = () => this.say('That part isn’t in this prototype yet.');

    const decideOne = (j, val) => () => this.decide([j.id], val, (val === 'approved' ? 'Approved: ' : 'Skipped: ') + j.role + ' at ' + j.company);
    const pendingCards = pendingJobs.map((j) => Object.assign({}, j, {
      approve: decideOne(j, 'approved'),
      skip: decideOne(j, 'skipped'),
      preview: notInProto,
      open: go('matches', { tab: 'waiting' })
    }));
    const approvedRows = approvedNew
      .map((j) => Object.assign({}, j, { canUndo: true, undo: () => this.decide([j.id], null, null) }))
      .concat(prior.map((j) => Object.assign({}, j, { canUndo: false, undo: null })));
    const skippedRows = skipped.map((j) => Object.assign({}, j, { undo: () => this.decide([j.id], null, null) }));

    const tab = c.tab;
    const mkTab = (key, label, count) => {
      const on = tab === key;
      const hot = key === 'waiting' && count > 0;
      return {
        label: label, count: String(count), selected: on,
        line: on ? '#111111' : 'transparent', weight: on ? '600' : '500', color: on ? '#111111' : '#52525B',
        countBg: hot ? '#FFF1DE' : '#F1F1F2', countColor: hot ? '#B45309' : '#3F3F46',
        pick: () => this.put({ tab: key })
      };
    };
    const tabs = [mkTab('waiting', 'Waiting for you', pending), mkTab('approved', 'Approved', approvedCount), mkTab('skipped', 'Skipped', skipped.length)];

    const step = (num, label, you, hi) => ({
      num: hj ? String(num) : '–', label: label, owner: you ? 'You' : 'InterviewSurge', isYou: you, notYou: !you,
      bg: hi ? '#FFF8EE' : '#FAFAFA', border: hi ? '#F3D9B1' : '#F1F1F2', numColor: hi ? '#B45309' : '#111111',
      chipBg: you ? '#FFF1DE' : '#EEEEF0', chipColor: you ? '#B45309' : '#3F3F46', arrow: true
    });
    const steps = [
      step(11, 'Jobs matched', false, false),
      step(6, 'CVs tailored', false, false),
      step(pending, 'Waiting for you', true, pending > 0),
      step(approvedCount, 'Approved', true, false),
      step(0, 'Applied', false, false)
    ];
    steps[4].arrow = false;

    const howSteps = [
      { n: '1', text: 'We find jobs that match you', owner: 'InterviewSurge', chipBg: '#EEEEF0', chipColor: '#3F3F46' },
      { n: '2', text: 'We tailor a CV for each one', owner: 'InterviewSurge', chipBg: '#EEEEF0', chipColor: '#3F3F46' },
      { n: '3', text: 'You approve, we apply', owner: 'You', chipBg: '#FFF1DE', chipColor: '#B45309' }
    ];

    const profileSections = secs.map((x) => {
      const done = !!prof[x.key];
      return Object.assign({}, x, {
        done: done, notDone: !done,
        status: done ? 'Done' : 'Not started',
        statusBg: done ? '#F1F1F2' : '#FFF1DE', statusColor: done ? '#111111' : '#B45309',
        btn: done ? 'Edit' : 'Add',
        toggle: done ? notInProto : () => this.put((cc) => ({ profile: Object.assign({}, cc.profile, { [x.key]: true }) }))
      });
    });

    const approvedAll = approvedNew.concat(prior);
    const clearList = approvedAll.slice(0, 4);
    const more = approvedAll.length - clearList.length;
    const n = approvedNew.length;
    const msg = c.msg || '';
    const sendDisabled = !msg.trim();
    const titles = { analytics: 'Analytics', cvs: 'CV library', instant: 'Instant CV', settings: 'Settings' };

    return {
      nav: nav,
      taskCount: taskCount,
      hasTasks: taskCount > 0,
      pending: pending,
      hasPending: pending > 0,
      hasJobs: hj,

      isHome: s === 'home',
      isMatches: s === 'matches',
      isProfile: s === 'profile',
      isOther: !!titles[s],
      otherTitle: titles[s] || '',

      goHome: go('home'),
      goMatches: go('matches', { tab: 'waiting' }),
      goReview: go('matches', { tab: 'waiting' }),
      goApproved: go('matches', { tab: 'approved' }),
      goProfile: go('profile'),
      goAnalytics: go('analytics'),
      goCvs: go('cvs'),
      goInstant: go('instant'),
      goSettings: go('settings'),
      tabApproved: () => this.put({ tab: 'approved' }),
      notInProto: notInProto,

      eyebrow: heroIsTask ? 'Needs you · ' + taskCount : hero === 'first' ? 'Up next' : 'All clear',
      eyebrowDot: heroIsTask ? '#EA8A1A' : hero === 'first' ? '#2563EB' : '#111111',
      heroReview: hero === 'review',
      heroProfile: hero === 'profile',
      heroFirst: hero === 'first',
      heroNew: hero === 'new',
      heroClear: hero === 'clear',
      reviewTitle: pending === 1 ? '1 job is ready for your go-ahead' : pending + ' jobs are ready for your go-ahead',
      reviewCta: pending === 1 ? 'Review 1 job' : 'Review ' + pending + ' jobs',
      pendingCards: pendingCards,
      howSteps: howSteps,
      clearList: clearList,
      hasClearMore: more > 0,
      clearMore: '+' + more + ' more',
      showProfileRow: showProfileRow,
      showSubEyebrow: hero === 'first',
      profileNum: hero === 'first' ? '1' : '2',
      setupPrefs: () => { this.armToast(); this.put({ isNew: false, toast: { text: 'Preferences saved. Your first job search runs today at 6:30 PM IST.', undo: null } }); },

      workTitle: c.isNew ? 'Ready when you are' : 'InterviewSurge is working',
      dotClass: c.isNew ? '' : 'pulse',
      dotColor: c.isNew ? '#A1A1AA' : '#2563EB',
      showNext: !c.isNew,
      isNewUser: !!c.isNew,

      msg: msg,
      sent: c.sent || [],
      noMessages: !(c.sent && c.sent.length),
      hasMessages: !!(c.sent && c.sent.length),
      sendDisabled: sendDisabled,
      sendBg: sendDisabled ? '#A1A1AA' : '#111111',
      onMsg: (e) => this.put({ msg: e.target.value }),
      sendMsg: (e) => {
        e.preventDefault();
        const t = msg.trim();
        if (!t) return;
        this.put((cc) => ({ sent: (cc.sent || []).concat([{ text: t }]), msg: '' }));
      },

      steps: steps,
      pipeCaption: hj ? 'All time. We handle every step except the ones marked You.' : 'Your numbers appear after your first job search. You only step in where it says You.',

      reviewed: hj ? 4 - pending : 0,
      reviewedPct: (hj ? Math.round(((4 - pending) / 4) * 100) : 0) + '%',
      tabs: tabs,
      showApproveAll: hj && tab === 'waiting' && pending > 1,
      approveAllLabel: 'Approve all ' + pending,
      approveAll: () => this.decide(pendingJobs.map((j) => j.id), 'approved', 'Approved ' + pending + ' jobs'),
      showWaitingList: hj && tab === 'waiting' && pending > 0,
      showDoneCard: hj && tab === 'waiting' && pending === 0,
      doneText: n > 0
        ? 'We’ll apply to the ' + n + (n === 1 ? ' job' : ' jobs') + ' you approved and update their status here. New matches arrive today at 6:30 PM IST.'
        : 'You skipped them all. We’ll use that to sharpen your next matches, arriving today at 6:30 PM IST.',
      showApprovedList: hj && tab === 'approved',
      approvedRows: approvedRows,
      showSkippedList: hj && tab === 'skipped',
      skippedRows: skippedRows,
      skippedEmpty: skipped.length === 0,
      showNoJobs: !hj,
      noJobsText: c.isNew
        ? 'Set up your job preferences on Home and we’ll start searching. Matches will appear here with a tailored CV for each.'
        : 'Your first job search runs today at 6:30 PM IST. Matches will appear here with a tailored CV for each.',

      profileSections: profileSections,
      profCount: profCount,
      profPct: Math.round((profCount / 3) * 100) + '%',
      saveLabel: profCount === 3 ? 'Save and finish' : 'Save for later',
      saveProfile: () => {
        const done = profCount === 3;
        this.armToast();
        this.put({ profileDone: done, screen: 'home', toast: { text: done ? 'Profile complete. We’ll use it for every application.' : 'Saved. You can finish the rest any time.', undo: null } });
      },

      hasToast: !!c.toast,
      toastText: c.toast ? c.toast.text : '',
      toastUndo: !!(c.toast && c.toast.undo),
      undoToast: () => { const ids = c.toast && c.toast.undo; if (ids) this.decide(ids, null, null); }
    };
  }
}

        : 'This tab is empty, so no filter will find anything here.',

<script>
window.__pages["instant-cv"] = class extends DCLogic {
  startAt() {
    return this.props.startAt ?? 'Link pasted';
  }

  base(s) {
    const link = 'https://www.linkedin.com/jobs/view/4012345678';
    const common = { optionsOpen: false, customCv: '', toast: null, recentNew: false, genStep: 0, error: false };
    if (s === 'Empty') return Object.assign(common, { text: '', phase: 'form' });
    if (s === 'Generating') return Object.assign(common, { text: link, phase: 'generating', genStep: 1 });
    if (s === 'Ready') return Object.assign(common, { text: link, phase: 'ready', genStep: 3, recentNew: true });
    if (s === 'Link can’t be read') return Object.assign(common, { text: 'https://careers.kestrelmobility.com/jobs/48213', phase: 'form', error: true });
    return Object.assign(common, { text: link, phase: 'form' });
  }

  cur() {
    const s = this.startAt();
    const st = this.state;
    if (st && st.forStart === s) return st;
    return Object.assign({ forStart: s }, this.base(s));
  }

  put(patch) {
    const s = this.startAt();
    this.setState((prev) => {
      const b = prev && prev.forStart === s ? prev : Object.assign({ forStart: s }, this.base(s));
      const p = typeof patch === 'function' ? patch(b) : patch;
      return Object.assign({}, b, p, { forStart: s });
    });
  }

  say(text) {
    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.put({ toast: null }), 4200);
    this.put({ toast: { text: text } });
  }

  detect(t) {
    const s = (t || '').trim();
    if (!s) return null;
    if (/^(https?:\/\/|www\.)/i.test(s)) {
      if (/linkedin\.com\/jobs/i.test(s)) return { kind: 'ok', label: 'LinkedIn job link' };
      if (/linkedin\.com\/(posts|feed)/i.test(s)) return { kind: 'ok', label: 'LinkedIn post' };
      if (/linkedin\.com/i.test(s)) return { kind: 'bad', label: 'This LinkedIn link isn’t a job or a post. Paste the job’s own link.' };
      return { kind: 'ok', label: 'Job link' };
    }
    const words = s.split(/\s+/).length;
    if (words < 40) return { kind: 'warn', label: 'This looks short for a job description (' + words + ' words). Paste the full text for a better CV.' };
    return { kind: 'ok', label: 'Job description · ' + words + ' words' };
  }

  tick(i) {
    clearTimeout(this._gt);
    this._gt = setTimeout(() => {
      const next = i + 1;
      if (next >= 3) {
        this.put({ phase: 'ready', genStep: 3, recentNew: true });
      } else {
        this.put({ genStep: next });
        this.tick(next);
      }
    }, 1300);
  }

  componentWillUnmount() {
    clearTimeout(this._tt);
    clearTimeout(this._gt);
  }

  renderVals() {
    const c = this.cur();
    const d = this.detect(c.text);
    const hasText = !!(c.text && c.text.trim());
    const blocked = !d || d.kind === 'bad' || c.error;
    const notInProto = () => this.say('That part isn’t in this prototype yet.');
    const isLinkedIn = /linkedin\.com/i.test(c.text || '');
    const isUrl = /^(https?:\/\/|www\.)/i.test((c.text || '').trim());
    const jobName = isLinkedIn ? 'Senior Full Stack Engineer at Northwind Labs'
      : isUrl ? 'Full Stack Engineer II at Kestrel Mobility'
      : 'the job description you pasted';
    const fileName = isLinkedIn ? 'CV_Northwind_Labs_Senior_Full_Stack_Engineer.pdf'
      : isUrl ? 'CV_Kestrel_Mobility_Full_Stack_Engineer_II.pdf'
      : 'CV_Tailored_30_Sep_2026.pdf';

    const stepLabels = ['Reading the job', 'Matching it to your experience', 'Writing your tailored CV'];
    const genSteps = stepLabels.map((label, i) => {
      const done = i < c.genStep;
      const active = i === c.genStep;
      return { label: label, done: done, active: active, todo: !done && !active, weight: active ? '600' : '500', color: done || active ? '#111111' : '#6B6B73' };
    });

    const recentBase = [
      { role: 'Full Stack Engineer', company: 'Quill Analytics', when: 'Yesterday', isNew: false },
      { role: 'React Developer', company: 'Harbor Labs', when: '26 Sep', isNew: false },
      { role: 'Node.js Developer', company: 'Zephyr Pay', when: '22 Sep', isNew: false }
    ];
    const recent = (c.recentNew
      ? [{ role: isLinkedIn ? 'Senior Full Stack Engineer' : isUrl ? 'Full Stack Engineer II' : 'Pasted job description', company: isLinkedIn ? 'Northwind Labs' : isUrl ? 'Kestrel Mobility' : 'Instant CV', when: 'Just now', isNew: true }].concat(recentBase)
      : recentBase).map((r) => Object.assign({}, r, { open: notInProto }));

    let ctaHint = 'We’ll save it to your CV library.';
    if (!hasText) ctaHint = 'Paste a job link or description to continue.';
    else if (c.error) ctaHint = 'Paste the job description to continue.';
    else if (d && d.kind === 'bad') ctaHint = 'Fix the link above to continue.';

    return {
      notInProto: notInProto,
      yes: true,
      noop: () => {},

      showForm: c.phase === 'form',
      showProgress: c.phase === 'generating',
      showReady: c.phase === 'ready',

      text: c.text,
      onText: (e) => this.put({ text: e.target.value, error: false }),
      clearText: () => this.put({ text: '', error: false }),
      hasText: hasText,
      inputBorder: c.error || (d && d.kind === 'bad') ? '#EA8A1A' : '#D4D4D8',
      detOk: !!d && d.kind === 'ok' && !c.error,
      detWarn: !!d && (d.kind === 'warn' || d.kind === 'bad') && !c.error,
      detNone: !d,
      detLabel: d ? d.label : '',
      showError: !!c.error,

      baseCv: c.customCv || 'DEB_IS_CV.pdf',
      hasCustomCv: !!c.customCv,
      optionsOpen: !!c.optionsOpen,
      optionsLabel: c.optionsOpen ? 'Done' : 'Change',
      toggleOptions: () => this.put((cc) => ({ optionsOpen: !cc.optionsOpen })),
      onFile: (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) this.put({ customCv: f.name });
      },
      clearFile: () => this.put({ customCv: '' }),
      fileNote: c.customCv ? 'Using ' + c.customCv + ' for this CV' : 'PDF or Word. Your saved base CV won’t change.',

      ctaDisabled: blocked,
      ctaBg: blocked ? '#A1A1AA' : '#111111',
      ctaClass: blocked ? '' : 'btn-dark',
      ctaHint: ctaHint,
      hintColor: blocked ? '#52525B' : '#6B6B73',
      generate: () => {
        if (blocked) return;
        this.put({ phase: 'generating', genStep: 0, optionsOpen: false });
        this.tick(0);
      },

      jobName: jobName,
      fileName: fileName,
      genSteps: genSteps,
      genPct: Math.round((Math.min(c.genStep, 3) / 3) * 100) + '%',
      download: () => this.say('Downloading ' + fileName),
      startOver: () => { clearTimeout(this._gt); this.put({ phase: 'form', text: '', error: false, genStep: 0 }); },

      recent: recent,

      hasToast: !!c.toast,
      toastText: c.toast ? c.toast.text : ''
    };
  }
}
</script>
<script>
window.__pages["cv-library"] = class extends DCLogic {
  cvs() {
    return [
      { id: 'c1', role: 'Full Stack AI Engineer, Creative Intelligence', company: 'Ai Case Leads', city: 'India', match: 'Possible', base: 58, ats: 58, date: '2026-09-29', locked: false, source: 'match' },
      { id: 'c2', role: 'Full Stack Engineer - Java, Python, Angular or React or Next Js', company: 'Optum India', city: 'Bengaluru, Karnataka', match: 'Possible', base: 57, ats: 57, date: '2026-09-29', locked: true, source: 'match' },
      { id: 'c3', role: 'Senior Full Stack AI Product Engineer - Agentic AI', company: 'Talentgigs', city: 'Chennai, Tamil Nadu', match: 'Possible', base: 55, ats: 58, date: '2026-09-29', locked: false, source: 'match' },
      { id: 'c4', role: 'Full Stack Engineer', company: 'Humanli.Ai', city: 'Jaipur, Rajasthan', match: 'Possible', base: 62, ats: 62, date: '2026-09-28', locked: true, source: 'match' },
      { id: 'c5', role: 'Senior Full Stack AI Product Engineer - Agentic AI', company: 'Talentgigs', city: 'Chennai, Tamil Nadu', match: 'Possible', base: 59, ats: 67, date: '2026-09-28', locked: false, source: 'match' },
      { id: 'c6', role: 'Full Stack AI Engineer (LLM Agents)', company: 'Metric Tree Labs', city: 'Kochi, Kerala', match: 'Possible', base: 57, ats: 64, date: '2026-09-28', locked: true, source: 'match' }
    ];
  }

  defaults() {
    return { tab: 'tailored', q: '', source: 'any', status: 'any', ats: 'any', date: 'any', sortKey: 'date', sortDir: 'desc', menu: null, preview: null, toast: null };
  }

  cur() {
    return Object.assign(this.defaults(), this.state || {});
  }

  put(patch) {
    this.setState((prev) => {
      const b = Object.assign(this.defaults(), prev || {});
      const p = typeof patch === 'function' ? patch(b) : patch;
      return Object.assign({}, b, p);
    });
  }

  say(text, extra) {
    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.put({ toast: null }), 4200);
    this.put(Object.assign({ toast: { text: text } }, extra || {}));
  }

  componentWillUnmount() {
    clearTimeout(this._tt);
  }

  renderVals() {
    const c = this.cur();
    const all = this.cvs();
    const notInProto = () => this.say('That part isn’t in this prototype yet.');
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const fmt = (d) => { const p = d.split('-'); return parseInt(p[2], 10) + ' ' + months[parseInt(p[1], 10) - 1]; };
    const today = Date.UTC(2026, 8, 30);
    const age = (d) => { const p = d.split('-'); return Math.round((today - Date.UTC(+p[0], +p[1] - 1, +p[2])) / 86400000); };
    const meter = (m) => {
      const n = m === 'Strong' ? 3 : m === 'Good' ? 2 : 1;
      return [6, 9, 12].map((h, i) => ({ h: h + 'px', bg: i < n ? '#111111' : '#D4D4D8' }));
    };

    const q = c.q.trim().toLowerCase();
    const passes = (v) => (!q || (v.role + ' ' + v.company).toLowerCase().indexOf(q) >= 0)
      && (c.source === 'any' || v.source === c.source)
      && (c.status === 'any' || (c.status === 'locked') === v.locked)
      && (c.ats === 'any' || v.ats >= parseInt(c.ats, 10))
      && (c.date === 'any' || age(v.date) <= parseInt(c.date, 10));
    const list = all.filter(passes);
    const dir = c.sortDir === 'asc' ? 1 : -1;
    list.sort((a, b) => {
      if (c.sortKey === 'ats') return (a.ats - b.ats) * dir || (a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
      return (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) * dir || b.ats - a.ats;
    });

    const chips = [];
    if (q) chips.push({ label: '“' + c.q.trim() + '”', clear: () => this.put({ q: '' }) });
    if (c.source !== 'any') chips.push({ label: c.source === 'match' ? 'From job matches' : 'Instant CV', clear: () => this.put({ source: 'any' }) });
    if (c.status !== 'any') chips.push({ label: c.status === 'ready' ? 'Ready to download' : 'Locked', clear: () => this.put({ status: 'any' }) });
    if (c.ats !== 'any') chips.push({ label: 'ATS ' + c.ats + '+', clear: () => this.put({ ats: 'any' }) });
    if (c.date !== 'any') chips.push({ label: c.date === '1' ? 'Last 24 hours' : 'Last ' + c.date + ' days', clear: () => this.put({ date: 'any' }) });
    const filtersOn = chips.length > 0;
    const clearAll = () => this.put({ q: '', source: 'any', status: 'any', ats: 'any', date: 'any' });

    const dl = (v, kind) => this.say('Downloading ' + kind + ': ' + v.role + ' · ' + v.company, { menu: null });
    const rows = list.map((v, i) => {
      const delta = v.ats - v.base;
      return Object.assign({}, v, {
        unlocked: !v.locked,
        sourceLabel: v.source === 'instant' ? 'Instant CV' : 'From job matches',
        bars: meter(v.match),
        delta: delta > 0 ? '+' + delta + ' vs base CV' : 'Same as base CV',
        deltaColor: delta > 0 ? '#111111' : '#6B6B73',
        deltaWeight: delta > 0 ? '600' : '400',
        dateLabel: fmt(v.date),
        lineColor: i === list.length - 1 ? 'transparent' : '#F1F1F2',
        menuOpen: c.menu === v.id,
        ariaMenu: 'Download ' + v.role + ' at ' + v.company,
        toggleMenu: () => this.put((cc) => ({ menu: cc.menu === v.id ? null : v.id })),
        dlPdf: () => dl(v, 'PDF'),
        dlDocx: () => dl(v, 'Word'),
        open: () => this.put({ preview: v.id, menu: null })
      });
    });

    const sortBy = (key) => () => this.put((cc) => (cc.sortKey === key ? { sortDir: cc.sortDir === 'desc' ? 'asc' : 'desc' } : { sortKey: key, sortDir: 'desc' }));
    const arrow = (key) => (c.sortKey === key ? (c.sortDir === 'desc' ? '↓' : '↑') : '');

    const readyCount = all.filter((v) => !v.locked).length;
    const lockedCount = all.length - readyCount;
    const n = list.length;

    const mkTab = (key, label, count) => {
      const on = c.tab === key;
      return { label: label, count: String(count), selected: on, line: on ? '#111111' : 'transparent', weight: on ? '600' : '500', color: on ? '#111111' : '#52525B', pick: () => this.put({ tab: key, menu: null }) };
    };

    const pv = c.preview ? all.find((v) => v.id === c.preview) : null;
    const pvDelta = pv ? pv.ats - pv.base : 0;

    return {
      notInProto: notInProto,
      toTailored: () => this.put({ tab: 'tailored' }),
      tabs: [mkTab('tailored', 'Tailored CVs', all.length), mkTab('base', 'Base CVs', 1)],
      isTailored: c.tab === 'tailored',
      isBase: c.tab === 'base',

      readyCount: readyCount,
      downloadReady: () => this.say('Downloading ' + readyCount + ' ready CVs as one ZIP file'),
      lockedTitle: lockedCount + (lockedCount === 1 ? ' CV is' : ' CVs are') + ' locked until you decide on the job',

      q: c.q, source: c.source, status: c.status, ats: c.ats, date: c.date,
      setQ: (e) => this.put({ q: e.target.value }),
      setSource: (e) => this.put({ source: e.target.value }),
      setStatus: (e) => this.put({ status: e.target.value }),
      setAts: (e) => this.put({ ats: e.target.value }),
      setDate: (e) => this.put({ date: e.target.value }),
      chips: chips,
      hasChips: filtersOn,
      clearAll: clearAll,

      resultText: n + (n === 1 ? ' CV' : ' CVs') + (filtersOn ? ' · filtered from ' + all.length : '') + ' · ' + readyCount + ' ready to download',
      hasRows: n > 0,
      rows: rows,
      sortAts: sortBy('ats'),
      sortDate: sortBy('date'),
      atsArrow: arrow('ats'),
      dateArrow: arrow('date'),
      atsHeadColor: c.sortKey === 'ats' ? '#111111' : '#6B6B73',
      dateHeadColor: c.sortKey === 'date' ? '#111111' : '#6B6B73',
      emptyInstant: n === 0 && c.source === 'instant',
      emptyFiltered: n === 0 && c.source !== 'instant',

      hasPreview: !!pv,
      closePreview: () => this.put({ preview: null }),
      pvRole: pv ? pv.role : '',
      pvCompany: pv ? pv.company : '',
      pvCity: pv ? pv.city : '',
      pvAts: pv ? String(pv.ats) : '',
      pvAtsNote: pv ? (pvDelta > 0 ? 'Up from ' + pv.base + ' (base CV)' : 'Same as base CV (' + pv.base + ')') : '',
      pvMatch: pv ? pv.match : '',
      pvDate: pv ? fmt(pv.date) : '',
      pvSource: pv ? (pv.source === 'instant' ? 'Instant CV' : 'From job matches') : '',
      pvUnlocked: !!pv && !pv.locked,
      pvLocked: !!pv && pv.locked,
      pvPdf: () => { if (pv) dl(pv, 'PDF'); },
      pvDocx: () => { if (pv) dl(pv, 'Word'); },

      hasToast: !!c.toast,
      toastText: c.toast ? c.toast.text : ''
    };
  }
}

      { company: 'Humanli.Ai', role: 'Full Stack Engineer', base: 62, ats: 62 },

  defaults() {

  cur() {

  }

  put(patch) {

  }

  say(text) {
    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.put({ toast: null }), 4200);
    this.put({ toast: { text: text } });
  }

  componentWillUnmount() {
    clearTimeout(this._tt);

  renderVals() {

    const colors = ['#71717A', '#2563EB', '#EA8A1A'];
    const names = ['Jobs matched', 'CVs tailored', 'Approved by you'];
    const act = this.activity();
    const n = c.range === '30' ? 30 : c.range === 'all' ? 3 : 7;
    const wds = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const yMax = 8;
    const plotH = 220;

    const dayList = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(Date.UTC(2026, 8, 30) - i * 86400000);
      const key = d.toISOString().slice(0, 10);
      dayList.push({ key: key, day: d.getUTCDate(), wd: wds[d.getUTCDay()], vals: act[key] || [0, 0, 0] });
    }

      goPlan: go('plan'),
      goCriteria: go('criteria'),
      goBase: go('base'),
      isGeneral: c.section === 'general',
      isSearch: c.section === 'search',
      isCriteria: c.section === 'criteria',
      isBase: c.section === 'base',
      isApply: c.section === 'apply',
      isPlan: c.section === 'plan',
      isPrivacy: c.section === 'privacy',

      form: f,
      setName: setField('name'),
      setCountry: setField('country'),
      setTz: setField('tz'),
      setSearchTime: setField('searchTime'),

      dial: dials[f.country] || '+91',
      phoneDisplay: this.fmtPhone(digits),
      setPhone: (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 10); this.put((cc) => ({ form: Object.assign({}, cc.form, { phone: d }) })); },
      phoneHint: partial ? 'Enter all 10 digits (' + digits.length + ' so far)' : digits.length === 10 ? 'Saved as ' + (dials[f.country] || '+91') + ' ' + this.fmtPhone(digits) : '10 digits. We add the dashes for you.',
      phoneHintColor: partial ? '#B45309' : '#6B6B73',
      phoneBorder: partial ? '#EA8A1A' : '#D4D4D8',

      showTzHint: showTzHint,
      tzBorder: showTzHint ? '#EA8A1A' : '#D4D4D8',
      useIst: () => this.put((cc) => ({ form: Object.assign({}, cc.form, { tz: 'Asia/Kolkata' }) })),

      links: links,
      addLink: () => this.put((cc) => ({ nextId: cc.nextId + 1, form: Object.assign({}, cc.form, { links: cc.form.links.concat([{ id: cc.nextId, url: '' }]) }) })),

      dailyOn: daily,
      dailyTrack: daily ? '#111111' : '#D4D4D8',
      dailyKnob: daily ? '22px' : '4px',
      toggleDaily: () => this.put((cc) => ({ form: Object.assign({}, cc.form, { nDaily: !cc.form.nDaily }) })),

      applySections: applyDefs.map((d, i) => ({ title: d[0], desc: d[1], line: i === applyDefs.length - 1 ? 'transparent' : '#F1F1F2' })),

      pwOpen: !!c.pwOpen,
      pwClosed: !c.pwOpen,
      openPw: () => this.put({ pwOpen: true }),
      closePw: () => this.put({ pwOpen: false, pwCur: '', pwNew: '', pwConf: '' }),
      pwCur: c.pwCur, pwNew: c.pwNew, pwConf: c.pwConf,
      setPwCur: (e) => this.put({ pwCur: e.target.value }),
      setPwNew: (e) => this.put({ pwNew: e.target.value }),
      setPwConf: (e) => this.put({ pwConf: e.target.value }),
      pwType: c.showPw ? 'text' : 'password',
      showPw: !!c.showPw,
      toggleShowPw: () => this.put((cc) => ({ showPw: !cc.showPw })),
      pwNewHint: newShort ? 'Use at least 8 characters' : 'At least 8 characters',
      pwNewColor: newShort ? '#B45309' : '#6B6B73',
      pwNewBorder: newShort ? '#EA8A1A' : '#D4D4D8',
      pwConfHint: mismatch ? 'These don’t match yet' : c.pwConf && !mismatch ? 'Passwords match' : ' ',
      pwConfColor: mismatch ? '#B45309' : '#6B6B73',
      pwConfBorder: mismatch ? '#EA8A1A' : '#D4D4D8',
      pwDisabled: !pwValid,
      pwBtnBg: pwValid ? '#111111' : '#A1A1AA',
      pwBtnClass: pwValid ? 'btn-dark' : '',
      updatePw: () => { if (pwValid) this.say('Password updated', { pwOpen: false, pwCur: '', pwNew: '', pwConf: '' }); },

      dirty: dirty,
      dirtyText: partial ? 'Finish your phone number to save' : 'You have unsaved changes',
      saveDisabled: partial,
      saveBg: partial ? '#A1A1AA' : '#111111',
      saveClass: partial ? '' : 'btn-dark',
      save: () => { if (!partial) this.say('Changes saved', { saved: JSON.parse(JSON.stringify(f)) }); },
      discard: () => this.put((cc) => ({ form: JSON.parse(JSON.stringify(cc.saved)) })),

      af: af,
      afSet: afSet,
      secs: secs,
      afSections: afSections,
      afAnswered: afAnswered,
      afTotal: afTotal,
      afPct: (afTotal ? Math.round((afAnswered / afTotal) * 100) : 0) + '%',
      afPhoneDisplay: fmtP(String(af.phone)),
      afSetPhone: (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 10); setAf({ phone: d }); },
      afPhoneBorder: afPartialPhone ? '#EA8A1A' : '#D4D4D8',
      segPhoneType: segOf('phoneType', [['mobile', 'Mobile'], ['home', 'Home'], ['work', 'Work']]),
      segAuth: segOf('authStatus', [['citizen', 'Citizen'], ['resident', 'Permanent resident'], ['visa', 'Visa holder'], ['other', 'Other']]),
      segStart: segOf('startMode', [['now', 'Immediately'], ['date', 'From a date']]),
      segWork: segOf('workPref', [['onsite', 'On-site'], ['hybrid', 'Hybrid'], ['remote', 'Remote'], ['any', 'Any']]),
      segTravel: segOf('travel', [['none', 'No travel'], ['some', 'Sometimes'], ['often', 'Often']]),
      segFreq: segOf('freq', [['year', 'Per year'], ['month', 'Per month'], ['hour', 'Per hour']]),
      segEmp: segOf('empStatus', [['employed', 'Employed'], ['notemployed', 'Not employed'], ['student', 'A student'], ['freelance', 'Freelance']]),
      rowsAuth: AUTH.map(ynRow),
      rowsAvail: AVAIL.map(ynRow),
      rowsPay: PAY.map(ynRow),
      rowsCons: CONS.map(ynRow),
      rowsUs: US.map(ynRow),
      showVisaDetails: af.yn.onVisa === 'yes',
      showSponsorCountries: sponsor,
      showReloc: af.yn.relocate === 'yes',
      showStartDate: af.startMode === 'date',
      curSymbol: symbols[af.currency] || af.currency,
      afSalaryDisplay: fmtMoney(af.salary),
      afSalMinDisplay: fmtMoney(af.salMin),
      afSetSalary: (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 12); setAf({ salary: d }); },
      afSetSalMin: (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 12); setAf({ salMin: d }); },
      usOpen: !!c.usOpen,
      usToggleLabel: c.usOpen ? 'Hide questions' : 'Show 5 questions',
      toggleUs: () => this.put((cc) => ({ usOpen: !cc.usOpen })),
      afDirty: afDirty,
      afSaveDisabled: !afDirty || afPartialPhone,
      afSaveBg: !afDirty || afPartialPhone ? '#A1A1AA' : '#111111',
      afSaveClass: !afDirty || afPartialPhone ? '' : 'btn-dark',
      afHint: !afDirty ? 'No changes yet' : afPartialPhone ? 'Finish your phone number to save' : 'We’ll use these answers on your next applications.',
      saveAf: () => { if (afDirty && !afPartialPhone) this.say('Profile saved', { apfSaved: JSON.parse(JSON.stringify(af)) }); },
      discardAf: () => this.put((cc) => ({ apf: JSON.parse(JSON.stringify(cc.apfSaved)) })),
      exportData: () => this.say('Preparing your download…'),
      consentActive: c.priv.consent === 'active',
      consentConfirm: c.priv.consent === 'confirm',
      consentWithdrawn: c.priv.consent === 'withdrawn',
      consentChip: c.priv.consent === 'withdrawn' ? 'Withdrawn' : 'Active',
      consentChipBorder: c.priv.consent === 'withdrawn' ? '#F1F1F2' : '#D4D4D8',
      consentChipBg: c.priv.consent === 'withdrawn' ? '#F1F1F2' : '#FFFFFF',
      consentChipColor: c.priv.consent === 'withdrawn' ? '#52525B' : '#111111',
      startWithdraw: () => this.put((cc) => ({ priv: Object.assign({}, cc.priv, { consent: 'confirm' }) })),
      cancelWithdraw: () => this.put((cc) => ({ priv: Object.assign({}, cc.priv, { consent: 'active' }) })),
      confirmWithdraw: () => {
        const day = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        this.say('Consent withdrawn', { priv: Object.assign({}, c.priv, { consent: 'withdrawn', withdrawnOn: day }) });
      },
      withdrawnOn: c.priv.withdrawnOn,
      delText: c.priv.delText,
      setDelText: (e) => { const v = e.target.value; this.put((cc) => ({ priv: Object.assign({}, cc.priv, { delText: v }) })); },
      delDisabled: c.priv.delText.trim().toLowerCase() !== 'you@example.com',
      delBg: c.priv.delText.trim().toLowerCase() === 'you@example.com' ? '#B42318' : '#F4F4F5',
      delColor: c.priv.delText.trim().toLowerCase() === 'you@example.com' ? '#FFFFFF' : '#A1A1AA',
      delClass: c.priv.delText.trim().toLowerCase() === 'you@example.com' ? 'btn-red' : '',
      delIdle: c.priv.delState === 'idle',
      delRequested: c.priv.delState === 'requested',
      requestedOn: c.priv.requestedOn,
      requestDelete: () => {
        if (c.priv.delText.trim().toLowerCase() !== 'you@example.com') return;
        const day = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        this.say('Deletion requested', { priv: Object.assign({}, c.priv, { delState: 'requested', requestedOn: day, delText: '' }) });
      },
      yes: true,
      daysLeft: Math.max(0, Math.ceil((Date.UTC(2027, 8, 27) - Date.now()) / 86400000)),
      cvAssign: cvAssign,
      cvRows: cvRows,
      cvCount: bc.cvs.length,
      labelDraft: bc.draft,
      setLabelDraft: (e) => setB({ draft: e.target.value }),
      saveLabel: (e) => {
        e.preventDefault();
        setB((b) => ({ editing: null, draft: '', cvs: b.cvs.map((x) => (x.id === b.editing ? Object.assign({}, x, { label: b.draft.trim().slice(0, 20) }) : x)) }));
      },
      cancelLabel: () => setB({ editing: null, draft: '' }),
      uploadCv: (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const name = f.name;
        e.target.value = '';
        setB((b) => ({ cvs: [{ id: 'c' + b.nextId, name: name, date: 'today', label: '' }].concat(b.cvs), nextId: b.nextId + 1 }));
        this.say('Uploaded ' + name + '. Choose where to use it above.');
      },

      profileCount: cr.profiles.length,
      profileTabs: cr.profiles.map((p) => {
        const on = p.id === cr.active;
        return { label: p.title.trim() || 'New profile', on: on, border: on ? '#111111' : '#E6E6E9', ring: on ? '0 0 0 1px #111111' : 'none', bg: on ? '#FFFFFF' : '#F7F7F8', weight: on ? '600' : '500', pick: () => setCrit({ active: p.id, draft: '' }) };
      }),
      canAddProfile: cr.profiles.length < 3,
      profilesFull: cr.profiles.length >= 3,
      addProfile: () => this.put((cc) => {
        const crit = cc.crit;
        if (crit.profiles.length >= 3) return {};
        const id = 'p' + crit.nextId;
        const np = { id: id, title: '', kw: {}, coMode: 'any', coList: [], inMode: 'any', inList: [], where: 'country', metros: [], other: '', reach: 'remote', exp: [], salMin: '', salMax: '' };
        return { crit: Object.assign({}, crit, { profiles: crit.profiles.concat([np]), active: id, nextId: crit.nextId + 1, draft: '' }) };
      }),

      crTitle: ap.title,
      setCrTitle: (e) => { const v = e.target.value; upd(() => ({ title: v })); },
      titleError: titleError,
      titleBorder: titleError ? '#EA8A1A' : '#D4D4D8',
      hasKw: kwKeys.length > 0,
      kwChips: kwKeys.map((k) => Object.assign({ label: k, toggle: () => upd((p) => ({ kw: Object.assign({}, p.kw, { [k]: !p.kw[k] }) })) }, chip(!!ap.kw[k]))),

      coOpts: coDefs.map((d) => Object.assign({ label: d[1], desc: d[2], pick: () => upd(() => ({ coMode: d[0] })) }, card(ap.coMode === d[0]))),
      showCoPicker: ap.coMode !== 'any',
      coPickerLabel: { skip: 'Companies to skip', only: 'Your companies', prefer: 'Companies to show first' }[ap.coMode] || '',
      hasCoChips: ap.coList.length > 0,
      coChips: ap.coList.map((n) => ({ label: n, remove: () => upd((p) => ({ coList: p.coList.filter((x) => x !== n) })) })),
      coDraft: cr.draft,
      setCoDraft: (e) => setCrit({ draft: e.target.value }),
      addCompany: (e) => {
        e.preventDefault();
        this.put((cc) => {
          const crit = cc.crit;
          const v = crit.draft.trim();
          if (!v) return {};
          return { crit: Object.assign({}, crit, { draft: '', profiles: crit.profiles.map((p) => (p.id === crit.active && p.coList.indexOf(v) < 0 ? Object.assign({}, p, { coList: p.coList.concat([v]) }) : p)) }) };
        });
      },

      inOpts: inDefs.map((d) => Object.assign({ label: d[1], desc: d[2], pick: () => upd(() => ({ inMode: d[0] })) }, card(ap.inMode === d[0]))),
      showInPicker: ap.inMode !== 'any',
      inPickerLabel: ap.inMode === 'skip' ? 'Industries to skip' : 'Your industries',
      inChips: industries.map((n) => Object.assign({ label: n, toggle: () => upd((p) => ({ inList: p.inList.indexOf(n) >= 0 ? p.inList.filter((x) => x !== n) : p.inList.concat([n]) })) }, chip(ap.inList.indexOf(n) >= 0))),

      whereOpts: [['country', 'Anywhere in India'], ['specific', 'Specific places']].map((d) => {
        const on = ap.where === d[0];
        return { label: d[1], on: on, bg: on ? '#FFFFFF' : 'transparent', shadow: on ? '0 1px 2px rgba(0,0,0,0.08)' : 'none', weight: on ? '600' : '500', pick: () => upd(() => ({ where: d[0] })) };
      }),
      showPlaces: ap.where === 'specific',
      hasMetros: ap.metros.length > 0,
      metroChips: ap.metros.map((m) => ({ label: m, remove: () => upd((p) => ({ metros: p.metros.filter((x) => x !== m) })) })),
      addMetro: (e) => { const v = e.target.value; if (v) upd((p) => (p.metros.indexOf(v) >= 0 ? {} : { metros: p.metros.concat([v]) })); },
      crOther: ap.other,
      setCrOther: (e) => { const v = e.target.value; upd(() => ({ other: v })); },
      reachOpts: reachDefs.map((d) => Object.assign({ label: d[1], desc: d[2], pick: () => upd(() => ({ reach: d[0] })) }, card(ap.reach === d[0]))),

      expOpts: expDefs.map((d) => {
        const on = ap.exp.indexOf(d[0]) >= 0;
        return Object.assign({ label: d[1], desc: d[2], boxBorder: on ? '#111111' : '#A1A1AA', boxBg: on ? '#111111' : '#FFFFFF', pick: () => upd((p) => ({ exp: p.exp.indexOf(d[0]) >= 0 ? p.exp.filter((x) => x !== d[0]) : p.exp.concat([d[0]]) })) }, card(on));
      }),
      expError: expError,

      salMinDisplay: fmtINR(salMin),
      salMaxDisplay: fmtINR(salMax),
      setSalMin: (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 10); upd(() => ({ salMin: d })); },
      setSalMax: (e) => { const d = e.target.value.replace(/\D/g, '').slice(0, 10); upd(() => ({ salMax: d })); },
      salError: salError,
      salMaxBorder: salError ? '#EA8A1A' : '#D4D4D8',

      summary: summary,

      critDirty: critDirty,
      critSaveDisabled: critSaveDisabled,
      critSaveBg: critSaveDisabled ? '#A1A1AA' : '#111111',
      critSaveClass: critSaveDisabled ? '' : 'btn-dark',
      critHint: !critDirty ? 'No changes yet' : !critValid ? 'Fix the highlighted fields to save' : 'Our team reviews changes before your next daily search.',
      critHintColor: critDirty && !critValid ? '#B45309' : '#6B6B73',
      saveCrit: () => { if (!critSaveDisabled) this.say('Saved. Our team will review it before your next daily search.', { crit: Object.assign({}, cr, { saved: deep(cr.profiles) }) }); },
      discardCrit: () => this.put((cc) => {
        const crit = cc.crit;
        const profiles = deep(crit.saved);
        const active = profiles.some((p) => p.id === crit.active) ? crit.active : profiles[0].id;
        return { crit: Object.assign({}, crit, { profiles: profiles, active: active, draft: '' }) };
      }),

      hasToast: !!c.toast,
      toastText: c.toast ? c.toast.text : ''
    };
  }
}
</script>
<script>
(function () {
  var R = window.React, h = R.createElement;
  window.__routes = {
    "Main.dc.html": "home",
    "Tracker.dc.html": "job-matches",
    "InstantCV.dc.html": "instant-cv",
    "CVLibrary.dc.html": "cv-library",
    "Analytics.dc.html": "analytics",
    "Settings.dc.html": "settings"
  };
  var PAGES = [
    ["home", "Home"],
    ["job-matches", "Job matches"],
    ["instant-cv", "Instant CV"],
    ["cv-library", "CV library"],
    ["analytics", "Analytics"],
    ["settings", "Settings"]
  ];
  PAGES.forEach(function (p) {
    var tpl = document.getElementById('tpl-' + p[0]).content;
    window.__pages[p[0]].__root = tpl.firstElementChild;
  });
  var SCENARIOS = ['Needs approval', 'First search scheduled', 'All caught up', 'New user'];
  var STARTS = ['Empty', 'Link pasted', 'Generating', 'Ready', 'Link can’t be read'];
  var ALIASES = { 'job-criteria': ['settings', 'criteria'], 'base-cvs': ['settings', 'base'], 'plan': ['settings', 'plan'], 'privacy': ['settings', 'privacy'], 'application-profile': ['settings', 'apply'] };
  function route() {
    var r = (location.hash || '').replace('#', '');
    if (ALIASES[r]) return r;
    return window.__pages[r] ? r : 'home';
  }
  function App() {
    var rs = R.useState(route()), raw = rs[0], setR = rs[1];
    var r = ALIASES[raw] ? ALIASES[raw][0] : raw;
    var startSection = ALIASES[raw] ? ALIASES[raw][1] : undefined;
    var sc = R.useState('Needs approval'), scenario = sc[0], setScenario = sc[1];
    var st = R.useState('Link pasted'), startAt = st[0], setStartAt = st[1];
    R.useEffect(function () {
      var f = function () { setR(route()); };
      window.addEventListener('hashchange', f);
      return function () { window.removeEventListener('hashchange', f); };
    }, []);
    var Page = window.__pages[r];
    var stateSel = null;
    if (r === 'home' || r === 'instant-cv') {
      var opts = r === 'home' ? SCENARIOS : STARTS;
      var cur = r === 'home' ? scenario : startAt;
      stateSel = h('label', { className: 'proto-state' }, 'Show state',
        h('select', { value: cur, onChange: function (e) { (r === 'home' ? setScenario : setStartAt)(e.target.value); } },
          opts.map(function (o) { return h('option', { key: o, value: o }, o); })));
    }
    return h(R.Fragment, null,
      h('div', { className: 'proto-narrow' }, 'Designed for a laptop or desktop screen. On a phone, scroll sideways to see the whole page.'),
      h('div', { className: 'proto-bar' },
        h('span', { className: 'proto-name' }, 'InterviewSurge v2 · prototype'),
        h('span', { className: 'proto-note' }, 'Sample data · nothing you type is saved or sent'),
        h('nav', { className: 'proto-tabs', 'aria-label': 'Prototype pages' }, PAGES.map(function (p) {
          return h('a', { key: p[0], href: '#' + p[0], className: 'proto-tab' + (r === p[0] ? ' on' : ''), 'aria-current': r === p[0] ? 'page' : undefined }, p[1]);
        })),
        stateSel),
      h('div', { id: 'stage' }, h(Page, { key: raw + '|' + scenario + '|' + startAt, scenario: scenario, startAt: startAt, startSection: startSection })));
  }
  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();
</script>
</body>
